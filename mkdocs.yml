site_name: SocialJev
site_description: Classification foundation models for the social sciences.
site_url: https://social-jev.github.io/docs/
repo_url: https://github.com/DGoettlich/social-jev
repo_name: GitHub
edit_uri: ''
copyright: SocialJev · Daniel Goettlich and Elliott Ash
hooks:
  - docs/hooks.py
exclude_docs: |
  hooks.py
  overrides/
theme:
  name: material
  custom_dir: docs/overrides
  font: false
  icon:
    logo: material/book-open-page-variant-outline
  palette:
    primary: custom
    accent: custom
  features:
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.highlight
    - content.code.copy
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            # Pydantic generates constructors; its fields are documented separately.
            docstring_options:
              warn_unknown_params: false
              warn_missing_types: false
            show_source: false
            show_root_heading: true
            show_signature_annotations: true
            signature_crossrefs: false
            members_order: source
            inherited_members: false
markdown_extensions:
  - admonition
  - attr_list
  - toc:
      title: On this page
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      auto_title: true
extra_css:
  - assets/stylesheets/theme.css
extra_javascript:
  - assets/javascripts/versions.js
extra:
  generator: false
nav:
  - Quickstart: index.md
  - Using SocialJev:
      - Installation: installation.md
      - Requests and results: requests-and-results.md
      - Batch inference: batch-inference.md
      - Serving: serving.md
  - Reference:
      - API: reference/api.md
      - Pipeline and model: reference/architecture.md
      - Checkpoints: reference/checkpoints.md
      - Performance measurements: reference/performance.md
  - Development:
      - Documentation and releases: releases.md
